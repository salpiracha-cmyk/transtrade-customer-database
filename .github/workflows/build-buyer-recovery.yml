name: Build Buyers Recovery EXE
on:
  push:
    paths: ['tools/buyer_recovery.py', '.github/workflows/build-buyer-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_buyer_recovery.py -v
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --onefile --windowed --name TTI_Buyers_Setup --distpath dist tools/buyer_recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: TTI_Buyers_Windows_EXE
          path: dist/TTI_Buyers_Setup.exe
          retention-days: 30
